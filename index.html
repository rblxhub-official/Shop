<!DOCTYPE html>
<html>
<head>
  <title>RBLX Hub Shop</title>

  <!-- MOBILE SUPPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Arial;
      background:#111;
      color:white;
      margin:0;
      text-align:center;
    }

    /* TOP BAR */
    #topBar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px;
      background:#0f0f0f;
    }

    #bell{
      font-size:24px;
      cursor:pointer;
      padding:10px;
    }

    /* UPDATE PANEL */
    #updatePanel{
      display:none;
      position:absolute;
      right:10px;
      top:60px;
      background:#1e1e1e;
      width:260px;
      border-radius:10px;
      padding:10px;
      box-shadow:0 0 10px black;
      text-align:left;
      z-index:999;
    }

    .update-item{
      background:#222;
      padding:8px;
      margin:5px 0;
      border-radius:6px;
      font-size:13px;
    }

    /* SHOP */
    .item{
      background:#1e1e1e;
      margin:10px auto;
      padding:15px;
      border-radius:10px;
      width:90%;
      max-width:300px;
    }

    button{
      padding:10px;
      border:none;
      background:#5865F2;
      color:white;
      border-radius:6px;
      cursor:pointer;
      width:100%;
    }

    button:hover{
      opacity:0.9;
    }

    input, textarea{
      width:90%;
      max-width:300px;
      padding:10px;
      margin:5px auto;
      border-radius:6px;
      border:none;
      display:block;
    }

    #cartList{
      padding:0;
    }

    #cartList li{
      list-style:none;
      background:#222;
      margin:5px auto;
      padding:10px;
      width:90%;
      max-width:300
      display:flex;
      justify-content:space-between;
      border-radius:8px;
    }

          footer {
      padding: 40px;
      color: #94a3b8;
      border-top: 1px solid #1e293b;
    }
  
  </style>
</head>

<body>

<!-- TOP BAR -->
<div id="topBar">
  <h2>🛒 RBLX HUB Shop</h2>

  <div id="bell" onclick="toggleUpdates()">
    🔔
  </div>
</div>

<!-- UPDATE PANEL -->
<div id="updatePanel">
  <h3>📢 Latest Updates</h3>
  <div id="updateList"></div>
</div>

<!-- SHOP -->
<div class="item">
  <h3>⭐ VIP Access</h3>
  <button onclick="addToCart('VIP Access')">Add to Cart</button>
</div>

<div class="item">
  <h3>⚡️Level Booster</h3>
  <button onclick="addToCart('Speed Boost')">Add to Cart</button>
</div>

<div class="item">
  <h3>💰 Coming Soon</h3>
  <button onclick="addToCart('2x Coins')">Add to Cart</button>
</div>

<hr>

<!-- CART -->
<h2>🛒 Cart</h2>
<ul id="cartList"></ul>

<hr>

<!-- CHECKOUT -->
<h2>🧾 Checkout</h2>

<input id="username" placeholder="Discord Username">
<textarea id="notes" placeholder="Notes..."></textarea>

<button onclick="sendOrder()">Send Order</button>

<footer>
  <h3 style="margin:0; color:#3b82f6;">RBLX HUB</h3>
  <p>Small Community, Big Energy.</p>
  <p>© 2025 RBLX HUB — All Rights Reserved</p>
  <p><span style="color:#3b82f6;">Version 1.5</span></p>
</footer>
  
<script>
let cart = [];
  
function addToCart(item){
  cart.push(item);
  updateCart();
}

function removeItem(i){
  cart.splice(i, 1);
  updateCart();
}

function updateCart(){
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  cart.forEach((item, i) => {
    let li = document.createElement("li");
    li.innerHTML = item + " <button onclick='removeItem("+i+")'>X</button>";
    list.appendChild(li);
  });
}

/* ---------------- DISCORD ORDER ---------------- */

function sendOrder(){

  const username = document.getElementById("username").value;
  const notes = document.getElementById("notes").value;

  if(username === ""){
    alert("Enter Discord username!");
    return;
  }

  let items = cart.map(i => "• " + i).join("\n");

  const webhookURL = "https://discord.com/api/webhooks/1513217518200688731/b82zKZRwQHZPZPB8xxXMRTECxcD4hyREehzPjAVWJj2O9Ep0_fHkrGpm_bnEPABy9Uvv";

  const payload = {
    content: "🛒 **New Order Received!**",
    embeds: [{
      title: "Order Details",
      color: 5814783,
      fields: [
        { name: "👤 Username", value: username },
        { name: "🛍️ Items", value: items || "Empty cart" },
        { name: "📝 Notes", value: notes || "None" }
      ]
    }]
  };

  fetch(webhookURL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });

  alert("Order sent to Discord!");

  cart = [];
  updateCart();
}

/* ---------------- UPDATES (BELL SYSTEM) ---------------- */

let updates = [
  "🎉 Welcome to RBLX Shop!"
];

function loadUpdates(){
  const list = document.getElementById("updateList");
  list.innerHTML = "";

  updates.forEach(u => {
    let div = document.createElement("div");
    div.className = "update-item";
    div.innerText = u;
    list.appendChild(div);
  });
}

function toggleUpdates(){
  const panel = document.getElementById("updatePanel");

  if(panel.style.display === "block"){
    panel.style.display = "none";
  } else {
    panel.style.display = "block";
    loadUpdates();
  }
}

</script>

</body>
</html>
